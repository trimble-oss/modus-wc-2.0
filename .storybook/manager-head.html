<link rel="icon" type="image/x-icon" href="./public/favicon.ico" />
<link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
<meta property="og:title" content="Modus Web Components Library 2.0" />
<meta name="robots" content="noindex, nofollow" />
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@trimble-oss/modus-icons@1/dist/modus-outlined/fonts/modus-icons.css"
/>
<script type="module" src="./modus-wc/modus-wc.esm.js"></script>
<script>
  // Load Modus styles in the manager context. Prefer the Vite path, then
  // the static-deploy copy. Hostname checks miss tunneled / forwarded hosts.
  (function () {
    const candidates = ['/src/styles/output.css', 'public/output.css'];
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    let index = 0;
    const loadNext = function () {
      if (index >= candidates.length) {
        return;
      }
      link.href = candidates[index++];
    };
    link.addEventListener('error', loadNext);
    document.head.appendChild(link);
    loadNext();
  })();
</script>
<style>
  html,
  body,
  body > *,
  .sb-wrapper {
    font-family:
      'Open Sans',
      system-ui,
      -apple-system,
      'Segoe UI',
      roboto,
      'Helvetica Neue',
      'Noto Sans',
      'Liberation Sans',
      arial !important;
  }
</style>
