<!doctype html>
<!-- Viewer for docs/component-graph/component-graph.json. Edit this file; it is not generated. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modus WC Component Dependency Graph</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@trimble-oss/moduswebcomponents@1.15.1/modus-wc-variables.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@trimble-oss/moduswebcomponents@1.15.1/modus-wc-styles.css"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@trimble-oss/moduswebcomponents@1.15.1/modus-wc/modus-wc.esm.js"
    ></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--modus-wc-color-trimble-gray, #252a2e);
        background: var(--modus-wc-color-white, #ffffff);
        display: grid;
        grid-template-columns: 1fr 340px;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }

      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid
          var(--modus-wc-color-trimble-gray-light, #cbcdd6);
      }

      header .search {
        margin-inline-start: auto;
        width: 280px;
      }

      #canvas-wrap {
        position: relative;
        overflow: hidden;
      }

      canvas {
        display: block;
        cursor: grab;
      }

      aside {
        border-inline-start: 1px solid
          var(--modus-wc-color-trimble-gray-light, #cbcdd6);
        padding: 12px;
        overflow-y: auto;
        background: var(--modus-wc-color-trimble-gray-lightest, #f1f1f6);
      }

      aside modus-wc-card {
        display: block;
      }

      .details-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .details-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        align-items: flex-start;
      }

      .details-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        word-break: break-all;
      }

      .legend {
        position: absolute;
        bottom: 10px;
        inset-inline-start: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <modus-wc-typography
        hierarchy="h1"
        size="sm"
        weight="semibold"
        label="Modus WC Component Dependency Graph"
      ></modus-wc-typography>
      <modus-wc-typography
        id="stats"
        hierarchy="p"
        size="sm"
        weight="normal"
        label=""
      ></modus-wc-typography>
      <div class="search">
        <modus-wc-text-input
          id="search"
          size="sm"
          placeholder="Search components…"
          aria-label="Search components"
        ></modus-wc-text-input>
      </div>
    </header>
    <div id="canvas-wrap">
      <canvas id="graph"></canvas>
      <modus-wc-card class="legend" bordered padding="compact">
        <modus-wc-typography
          hierarchy="p"
          size="sm"
          label="Solid edge: JSX composition • Dashed edge: slot composition • Click a node for details, drag to pan, scroll to zoom"
        ></modus-wc-typography>
      </modus-wc-card>
    </div>
    <aside>
      <modus-wc-card id="details-card" bordered padding="comfortable">
        <modus-wc-typography
          slot="title"
          hierarchy="h2"
          size="sm"
          weight="semibold"
          label="Component details"
        ></modus-wc-typography>
        <div id="details" class="details-body">
          <modus-wc-typography
            hierarchy="p"
            size="sm"
            label="Click a node to inspect its props, events, and impact."
          ></modus-wc-typography>
        </div>
      </modus-wc-card>
    </aside>
    <script>
      fetch('./component-graph.json')
        .then((response) => {
          if (!response.ok) {
            throw new Error(
              'Could not load component-graph.json (' + response.status + ')'
            );
          }
          return response.json();
        })
        .then(initGraph)
        .catch((error) => {
          document.getElementById('stats').label = String(error.message);
        });

      function initGraph(GRAPH) {
        const canvas = document.getElementById('graph');
        const ctx = canvas.getContext('2d');
        const wrap = document.getElementById('canvas-wrap');
        const details = document.getElementById('details');
        const detailsCard = document.getElementById('details-card');
        const searchInput = document.getElementById('search');
        const statsEl = document.getElementById('stats');

        statsEl.label =
          GRAPH.nodes.length + ' components, ' + GRAPH.edges.length + ' edges';

        const nodes = GRAPH.nodes.map((n, i) => ({
          ...n,
          x: Math.cos((i / GRAPH.nodes.length) * 2 * Math.PI) * 420,
          y: Math.sin((i / GRAPH.nodes.length) * 2 * Math.PI) * 420,
          vx: 0,
          vy: 0,
          degree: 0,
        }));
        const byTag = new Map(nodes.map((n) => [n.tag, n]));
        const edges = GRAPH.edges
          .map((e) => ({
            ...e,
            s: byTag.get(e.source),
            t: byTag.get(e.target),
          }))
          .filter((e) => e.s && e.t);
        edges.forEach((e) => {
          e.s.degree++;
          e.t.degree++;
        });

        const reverseImpact = {};
        const directParents = new Map(nodes.map((n) => [n.tag, new Set()]));
        for (const e of edges) {
          directParents.get(e.t.tag)?.add(e.s.tag);
        }
        for (const n of nodes) {
          const impacted = new Set();
          const queue = [...(directParents.get(n.tag) ?? [])];
          while (queue.length > 0) {
            const parent = queue.pop();
            if (impacted.has(parent)) {
              continue;
            }
            impacted.add(parent);
            queue.push(...(directParents.get(parent) ?? []));
          }
          reverseImpact[n.tag] = [...impacted].sort();
        }

        let selected = null;
        let highlightSet = null;
        let query = '';
        let scale = 0.7;
        let offsetX = 0;
        let offsetY = 0;

        function resize() {
          canvas.width = wrap.clientWidth * devicePixelRatio;
          canvas.height = wrap.clientHeight * devicePixelRatio;
          canvas.style.width = wrap.clientWidth + 'px';
          canvas.style.height = wrap.clientHeight + 'px';
        }
        window.addEventListener('resize', () => {
          resize();
          requestDraw();
        });
        resize();

        // Simple force simulation: link springs + charge repulsion + centering.
        let simTicks = 0;
        let rafId = 0;
        const MAX_TICKS = 400;

        function simulate() {
          if (simTicks >= MAX_TICKS) {
            return false;
          }
          simTicks += 1;
          for (const e of edges) {
            const dx = e.t.x - e.s.x;
            const dy = e.t.y - e.s.y;
            const dist = Math.max(1, Math.hypot(dx, dy));
            const force = (dist - 140) * 0.004;
            e.s.vx += (dx / dist) * force;
            e.s.vy += (dy / dist) * force;
            e.t.vx -= (dx / dist) * force;
            e.t.vy -= (dy / dist) * force;
          }
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              const a = nodes[i];
              const b = nodes[j];
              const dx = b.x - a.x;
              const dy = b.y - a.y;
              const d2 = Math.max(400, dx * dx + dy * dy);
              const force = 2600 / d2;
              const dist = Math.sqrt(d2);
              a.vx -= (dx / dist) * force;
              a.vy -= (dy / dist) * force;
              b.vx += (dx / dist) * force;
              b.vy += (dy / dist) * force;
            }
          }
          let energy = 0;
          for (const n of nodes) {
            n.vx -= n.x * 0.0015;
            n.vy -= n.y * 0.0015;
            n.vx *= 0.85;
            n.vy *= 0.85;
            n.x += n.vx;
            n.y += n.vy;
            energy += n.vx * n.vx + n.vy * n.vy;
          }
          return energy > 0.02 && simTicks < MAX_TICKS;
        }

        function nodeRadius(n) {
          return 5 + Math.min(10, n.degree * 0.7);
        }

        function toScreen(n) {
          return {
            x: canvas.width / 2 / devicePixelRatio + (n.x + offsetX) * scale,
            y: canvas.height / 2 / devicePixelRatio + (n.y + offsetY) * scale,
          };
        }

        function draw() {
          ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
          ctx.clearRect(
            0,
            0,
            canvas.width / devicePixelRatio,
            canvas.height / devicePixelRatio
          );

          const searching = Boolean(query);

          for (const e of edges) {
            const dim = searching
              ? !(e.s.tag.includes(query) || e.t.tag.includes(query))
              : highlightSet &&
                !(highlightSet.has(e.s.tag) && highlightSet.has(e.t.tag));
            const s = toScreen(e.s);
            const t = toScreen(e.t);
            ctx.strokeStyle = dim ? 'rgba(203,205,214,0.35)' : '#9fa4b1';
            ctx.setLineDash(e.type === 'slot' ? [4, 4] : []);
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(t.x, t.y);
            ctx.stroke();
            ctx.setLineDash([]);

            if (!dim) {
              const angle = Math.atan2(t.y - s.y, t.x - s.x);
              const r = nodeRadius(e.t) * scale + 4;
              const ax = t.x - Math.cos(angle) * r;
              const ay = t.y - Math.sin(angle) * r;
              ctx.fillStyle = '#9fa4b1';
              ctx.beginPath();
              ctx.moveTo(ax, ay);
              ctx.lineTo(
                ax - 7 * Math.cos(angle - 0.4),
                ay - 7 * Math.sin(angle - 0.4)
              );
              ctx.lineTo(
                ax - 7 * Math.cos(angle + 0.4),
                ay - 7 * Math.sin(angle + 0.4)
              );
              ctx.fill();
            }
          }

          ctx.font = '11px system-ui, sans-serif';
          for (const n of nodes) {
            const p = toScreen(n);
            const r = nodeRadius(n) * scale;
            const matchesQuery = searching && n.tag.includes(query);
            const dimmed = searching
              ? !matchesQuery
              : Boolean(highlightSet && !highlightSet.has(n.tag));

            ctx.fillStyle =
              n === selected
                ? '#0063a3'
                : matchesQuery
                  ? '#e49325'
                  : dimmed
                    ? 'rgba(106,110,121,0.25)'
                    : '#4b5563';
            ctx.beginPath();
            ctx.arc(p.x, p.y, r, 0, 2 * Math.PI);
            ctx.fill();

            if (!dimmed || n === selected || matchesQuery) {
              ctx.fillStyle = dimmed ? 'rgba(37,42,46,0.3)' : '#252a2e';
              ctx.fillText(
                n.tag.replace('modus-wc-', ''),
                p.x + r + 4,
                p.y + 4
              );
            }
          }
        }

        function loop() {
          rafId = 0;
          const moving = simulate();
          draw();
          if (moving) {
            rafId = requestAnimationFrame(loop);
          }
        }

        function requestDraw() {
          if (!rafId) {
            draw();
          }
        }

        rafId = requestAnimationFrame(loop);

        function nodeAt(clientX, clientY) {
          const rect = canvas.getBoundingClientRect();
          const x = clientX - rect.left;
          const y = clientY - rect.top;
          return nodes.find((n) => {
            const p = toScreen(n);
            return Math.hypot(p.x - x, p.y - y) <= nodeRadius(n) * scale + 4;
          });
        }

        function escapeHtml(text) {
          return String(text)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function setCardTitle(label) {
          let title = detailsCard.querySelector('[slot="title"]');
          if (!title) {
            title = document.createElement('modus-wc-typography');
            title.setAttribute('slot', 'title');
            title.setAttribute('hierarchy', 'h2');
            title.setAttribute('size', 'sm');
            title.setAttribute('weight', 'semibold');
            detailsCard.prepend(title);
          }
          title.label = label;
        }

        function renderList(title, items, mapper, clickable) {
          if (!items.length) return '';
          const rows = items
            .map((item) => {
              if (clickable) {
                return (
                  '<modus-wc-button data-tag="' +
                  item +
                  '" color="tertiary" variant="borderless" size="sm" type="button">' +
                  escapeHtml(item) +
                  '</modus-wc-button>'
                );
              }
              return (
                '<modus-wc-typography hierarchy="p" size="sm" label="' +
                escapeHtml(mapper(item)) +
                '"></modus-wc-typography>'
              );
            })
            .join('');
          return (
            '<div class="details-list"><modus-wc-typography hierarchy="h3" size="sm" weight="semibold" label="' +
            escapeHtml(title + ' (' + items.length + ')') +
            '"></modus-wc-typography>' +
            rows +
            '</div>'
          );
        }

        function emptyDetails() {
          setCardTitle('Component details');
          details.innerHTML =
            '<modus-wc-typography hierarchy="p" size="sm" label="Click a node to inspect its props, events, and impact."></modus-wc-typography>';
        }

        function select(node) {
          selected = node;
          if (!node) {
            highlightSet = null;
            emptyDetails();
            requestDraw();
            return;
          }
          const renders = edges
            .filter((e) => e.s === node)
            .map((e) => e.t.tag)
            .sort();
          const usedBy = edges
            .filter((e) => e.t === node)
            .map((e) => e.s.tag)
            .sort();
          const impact = reverseImpact[node.tag] || [];
          highlightSet = new Set([node.tag, ...renders, ...usedBy]);

          setCardTitle(node.tag);
          details.innerHTML =
            (node.description
              ? '<modus-wc-typography hierarchy="p" size="sm" label="' +
                escapeHtml(node.description) +
                '"></modus-wc-typography>'
              : '') +
            renderList('Renders', renders, (t) => t, true) +
            renderList('Used by', usedBy, (t) => t, true) +
            renderList(
              'QA impact (transitive parents)',
              impact,
              (t) => t,
              true
            ) +
            renderList(
              'Props',
              node.props,
              (p) => p.name + ' ' + p.type,
              false
            ) +
            renderList(
              'Events',
              node.events,
              (e) => e.name + ' ' + e.type,
              false
            ) +
            renderList('Methods', node.methods, (m) => m, false);

          details
            .querySelectorAll('modus-wc-button[data-tag]')
            .forEach((btn) => {
              btn.addEventListener('buttonClick', () => {
                const target = byTag.get(btn.getAttribute('data-tag'));
                if (target) select(target);
              });
            });
          requestDraw();
        }

        let dragging = false;
        let lastX = 0;
        let lastY = 0;
        let moved = false;

        canvas.addEventListener('mousedown', (event) => {
          dragging = true;
          moved = false;
          lastX = event.clientX;
          lastY = event.clientY;
        });
        window.addEventListener('mousemove', (event) => {
          if (!dragging) return;
          const dx = event.clientX - lastX;
          const dy = event.clientY - lastY;
          if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
          offsetX += dx / scale;
          offsetY += dy / scale;
          lastX = event.clientX;
          lastY = event.clientY;
          requestDraw();
        });
        window.addEventListener('mouseup', (event) => {
          if (dragging && !moved) {
            select(nodeAt(event.clientX, event.clientY) || null);
          }
          dragging = false;
        });
        canvas.addEventListener(
          'wheel',
          (event) => {
            event.preventDefault();
            scale = Math.min(
              3,
              Math.max(0.2, scale * (event.deltaY < 0 ? 1.1 : 0.9))
            );
            requestDraw();
          },
          { passive: false }
        );

        function applySearchValue(value) {
          query = String(value || '')
            .trim()
            .toLowerCase();
          requestDraw();
        }

        searchInput.addEventListener('inputChange', (event) => {
          applySearchValue(event.currentTarget.value);
        });
        searchInput.addEventListener('clearClick', () => {
          applySearchValue('');
        });
      }
    </script>
  </body>
</html>
