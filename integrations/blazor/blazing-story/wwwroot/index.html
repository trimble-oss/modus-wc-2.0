<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modus Web Components – Blazing Story</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!--
    DON'T PUT component CSS / JS HERE.
    Place Modus-specific links in iframe.html instead so they load in the story canvas.
    -->
    <link rel="stylesheet" href="css/blazor-ui.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="loading-progress">
            <svg>
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="text"></div>
            <img src="_content/BlazingStory/images/icon.min.svg" />
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
