<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modus Web Components – Story Canvas</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!--
    CSS and JavaScript for the story canvas (component preview iframe).
    This is the correct place for component stylesheets and scripts.
    -->
    <!-- Modus icon font (served from the Blazor RCL static web assets) -->
    <link rel="stylesheet" href="_content/ModusWebComponents.Blazor/modus-icons.css" />
    <!-- Modus component styles (from the Blazor RCL static web assets — same path as in consuming apps) -->
    <link rel="stylesheet" href="_content/ModusWebComponents.Blazor/modus-wc-styles.css" />
    <link rel="stylesheet" href="css/blazor-ui.css" />
    <link rel="stylesheet" href="BlazingStoryApp.styles.css" />
    <!-- Stencil ESM bundle: registers all modus-wc-* custom elements in the browser -->
    <script type="module" src="dist/esm/index.js"></script>
    <!-- Blazor ↔ web-component event interop helper (from the Blazor RCL) -->
    <script src="_content/ModusWebComponents.Blazor/js/interop.js"></script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
