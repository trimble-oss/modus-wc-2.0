# This publishes various packages in this repository.
# It will update the package.json version, build the packages, publish them to the Artifactory NPM registry, as well as create a GitHub release.
# The packages consist of:
# - The Web Components package
# - The MCP package (published first after build, before framework packages)
# - The React package
# - The Angular package
# - The Vue package
# - The Blazor package
# - Storybook deploy to Azure (after GitHub release, before n8n notify)
# This is triggered by a manual run with a specified version number.

name: Publish & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish'
        required: true
        type: string

permissions:
  contents: write
  actions: write
  packages: write
  pull-requests: write

jobs:
  build-and-publish-wc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2

      - name: Install dependencies
        run: npm ci
        env:
          TRIMBLE_AGENTIC_NPM_TOKEN: ${{ secrets.TRIMBLE_AGENTIC_NPM_TOKEN }}
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version bump follows SemVer
        run: |
          set -euo pipefail

          current="$(node -p "require('./package.json').version")"

          # Capture the raw input version and ensure it does not start with 'v'
          input='${{ github.event.inputs.version }}'
          if [ "${input#v}" != "$input" ]; then
            echo "❌ Version '$input' must not start with 'v'. Please provide a bare SemVer like '1.2.3'." >&2
            exit 1
          fi

          # Validate that the input is a valid SemVer version using the semver CLI
          valid="$(npx --yes semver@7 "$input" || true)"
          if [ -z "$valid" ]; then
            echo "❌ '$input' is not a valid SemVer version." >&2
            exit 1
          fi

          # Compute expected MAJOR / MINOR / PATCH increments from the current version
          expectedMajor="$(npx --yes semver@7 -i major "$current")"
          expectedMinor="$(npx --yes semver@7 -i minor "$current")"
          expectedPatch="$(npx --yes semver@7 -i patch "$current")"

          if [ "$input" != "$expectedMajor" ] && [ "$input" != "$expectedMinor" ] && [ "$input" != "$expectedPatch" ]; then
            echo "❌ Invalid version bump: '$input' is not a valid SemVer increment from '$current'." >&2
            echo "   Expected one of:" >&2
            echo "     MAJOR: $expectedMajor (breaking changes)" >&2
            echo "     MINOR: $expectedMinor (new features)" >&2
            echo "     PATCH: $expectedPatch (bug fixes)" >&2
            exit 1
          fi

          echo "✅ Version bump from $current to $input is valid."

      - name: Update package.json version
        run: |
          jq --arg version "${{ github.event.inputs.version }}" \
          '.version = $version' package.json > package.json.tmp && \
          mv package.json.tmp package.json

      - name: Build web components
        run: npm run build:ci

      - name: Set npm Registry Auth Token
        run: npm set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      - name: Pack the package
        working-directory: dist
        run: npm pack
        id: npm_pack

      - name: Upload tarball as artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: 'dist/*.tgz'

      - run: rm dist/*.tgz

      - name: Publish npm Package Publicly
        working-directory: dist
        run: npm publish --registry=https://registry.npmjs.org

      - name: Set GitHub Registry Auth Token
        working-directory: dist
        run: npm set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm Package to GitHub Registry
        working-directory: dist
        run: npm publish --registry=https://npm.pkg.github.com --access public --ignore-scripts

      - name: Commit version bump and open PR to main
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          BRANCH="chore/version-bump-${{ github.event.inputs.version }}"
          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "chore: bump version to ${{ github.event.inputs.version }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: bump version to ${{ github.event.inputs.version }}" \
            --body "Automated version bump after publishing \`${{ github.event.inputs.version }}\` to npm." \
            --base main \
            --head "$BRANCH"

  publish-mcp:
    needs: build-and-publish-wc
    uses: ./.github/workflows/publish-mcp.yml
    with:
      version: ${{ github.event.inputs.version }}
    secrets: inherit

  trigger-angular-publish:
    needs: publish-mcp
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Angular Publish Workflow
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1.3
        with:
          workflow: publish-angular.yml
          inputs: '{"version": "${{ github.event.inputs.version }}"}'

  trigger-react-publish:
    needs: publish-mcp
    runs-on: ubuntu-latest
    steps:
      - name: Trigger React Publish Workflow
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1.3
        with:
          workflow: publish-react.yml
          inputs: '{"version": "${{ github.event.inputs.version }}"}'

  trigger-vue-publish:
    needs: publish-mcp
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vue Publish Workflow
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1.3
        with:
          workflow: publish-vue.yml
          inputs: '{"version": "${{ github.event.inputs.version }}"}'

  trigger-blazor-publish:
    needs: publish-mcp
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Blazor Publish Workflow
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1.3
        with:
          workflow: publish-blazor.yml
          inputs: '{"version": "${{ github.event.inputs.version }}"}'

  release-wc:
    needs: build-and-publish-wc
    runs-on: ubuntu-latest
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: .

      - name: Find the asset
        id: find-asset
        run: echo "asset_path=$(find . -name 'trimble-oss-moduswebcomponents-*.tgz')" >> $GITHUB_OUTPUT

      - name: Rename the asset to package.tgz
        run: mv ${{ steps.find-asset.outputs.asset_path }} package.tgz

      - name: Get draft release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="moduswebcomponents-${{ github.event.inputs.version }}"
          body="$(gh api "repos/${{ github.repository }}/releases" \
            --jq "[.[] | select(.draft == true and .tag_name == \"${TAG}\")][0].body // empty")"

          if [ -z "$body" ]; then
            body="$(gh api "repos/${{ github.repository }}/releases" \
              --jq '[.[] | select(.draft == true)][0].body // empty')"
          fi

          delimiter="$(openssl rand -hex 16)"
          {
            echo "body<<${delimiter}"
            echo "$body"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: moduswebcomponents-${{ github.event.inputs.version }}
          name: Modus Web Components ${{ github.event.inputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            package.tgz

  deploy-storybook:
    needs: release-wc
    uses: ./.github/workflows/azure-static-web-apps-gentle-mushroom-083c46a10.yml
    secrets: inherit

  notify-n8n:
    needs: deploy-storybook
    runs-on: ubuntu-latest
    if: github.repository == 'trimble-oss/modus-wc-2.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Notify n8n with release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          TRIMBLE_N8N_CLIENT_ID: ${{ secrets.TRIMBLE_N8N_CLIENT_ID }}
          TRIMBLE_N8N_CLIENT_SECRET: ${{ secrets.TRIMBLE_N8N_CLIENT_SECRET }}
        run: bash .github/scripts/notify-n8n-release.sh "${{ github.event.inputs.version }}" publish
