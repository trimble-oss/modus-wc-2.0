name: Check designer context

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/custom-elements.json'
      - 'src/components/**'
      - 'src/styles/**'
      - 'docs/component-graph/**'
      - 'scripts/generate-designer-context.cjs'
      - 'designer-context.json'
  push:
    branches: [main]
    paths:
      - 'src/custom-elements.json'
      - 'src/components/**'
      - 'src/styles/**'
      - 'docs/component-graph/**'
      - 'scripts/generate-designer-context.cjs'
      - 'designer-context.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check designer context
        run: node scripts/generate-designer-context.cjs --check

      - name: Test designer context
        run: node --test scripts/generate-designer-context.test.cjs
