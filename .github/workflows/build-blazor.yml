name: Build Blazor Integration

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number (used to version the preview NuGet artifact)'
        required: false
        type: string
        default: '0'
    secrets:
      TRIMBLE_AGENTIC_NPM_TOKEN:
        required: true

jobs:
  build-blazor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Install dependencies
        run: npm ci
        env:
          TRIMBLE_AGENTIC_NPM_TOKEN: ${{ secrets.TRIMBLE_AGENTIC_NPM_TOKEN }}
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Stencil components (generates Blazor RCL)
        run: npm run build:ci

      - name: Build Blazor RCL
        run: |
          dotnet build integrations/blazor/stencil-generated/ModusWebComponents.Blazor \
            -c Release \
            -p:Version="0.0.0-pr${{ inputs.pr_number }}.${{ github.run_number }}"

      - name: Pack Blazor RCL (preview NuGet for QA)
        run: |
          dotnet pack integrations/blazor/stencil-generated/ModusWebComponents.Blazor \
            -c Release --no-build \
            -p:Version="0.0.0-pr${{ inputs.pr_number }}.${{ github.run_number }}" \
            --output ./nuget-output

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ModusWebComponents.Blazor-pr${{ inputs.pr_number }}-run${{ github.run_number }}
          path: nuget-output/*.nupkg
