name: Cleanup PR Previews
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: gh-pages # Checkout the gh-pages branch
          fetch-depth: 1

      - name: Setup Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Remove PR Previews
        run: |
          PR="${{ github.event.pull_request.number }}"
          CHANGED=false

          if [ -d "pr-preview/pr-${PR}" ]; then
            git rm -rf pr-preview/pr-${PR}
            CHANGED=true
          fi

          if [ -d "blazor-preview/pr-${PR}" ]; then
            git rm -rf blazor-preview/pr-${PR}
            CHANGED=true
          fi

          if [ "$CHANGED" = "true" ]; then
            git commit -m "Remove PR #${PR} previews"
            git push origin gh-pages
          else
            echo "No preview directories found for PR #${PR}"
          fi
