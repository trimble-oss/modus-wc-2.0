name: Component Graph Check

on:
  # Feature PRs never update graph files. Only re-test the generator when it
  # (or this workflow) changes.
  pull_request:
    branches:
      - 'main'
    paths:
      - 'scripts/generate-component-graph.mjs'
      - 'scripts/generate-component-graph.spec.mjs'
      - '.github/workflows/component-graph-check.yml'
  # After a merge to main, publish a fresh graph. No PR and no author steps.
  push:
    branches:
      - 'main'
    paths:
      - 'src/components/**'
      - 'src/custom-elements.json'
      - 'scripts/generate-component-graph.mjs'
      - 'scripts/generate-component-graph.spec.mjs'
      - '.github/workflows/component-graph-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test graph generator
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      - name: Run graph generator unit tests
        run: node --test scripts/generate-component-graph.spec.mjs

  # Main is protected, so this never pushes to main. It force-pushes generated
  # JSON/Mermaid to the unprotected `component-graph` branch. QA should read
  # that branch (or the workflow artifact). Feature PRs do nothing.
  publish:
    name: Publish component graph
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: component-graph-publish
      cancel-in-progress: false

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      - name: Run graph generator unit tests
        run: node --test scripts/generate-component-graph.spec.mjs

      - name: Regenerate component graph
        run: node scripts/generate-component-graph.mjs

      - name: Upload graph artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-graph
          path: |
            docs/component-graph/component-graph.json
            docs/component-graph/component-graph.mmd

      - name: Publish graph to component-graph branch
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo '::error::BOT_PAT is required to publish the graph branch (main is protected).'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/component-graph/component-graph.json docs/component-graph/component-graph.mmd
          git checkout -B component-graph
          if ! git diff --cached --quiet; then
            git commit -m "chore: Refresh component dependency graph"
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin component-graph --force
