name: Component Graph Check

on:
  # Feature PRs do not need to commit graph files. Only re-test the generator
  # when the generator itself (or this workflow) changes.
  pull_request:
    branches:
      - 'main'
    paths:
      - 'scripts/generate-component-graph.mjs'
      - 'scripts/generate-component-graph.spec.mjs'
      - '.github/workflows/component-graph-check.yml'
  # After a merge to main, refresh JSON/Mermaid via one standing PR.
  push:
    branches:
      - 'main'
    paths:
      - 'src/components/**'
      - 'src/custom-elements.json'
      - 'scripts/generate-component-graph.mjs'
      - 'scripts/generate-component-graph.spec.mjs'
      - '.github/workflows/component-graph-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test graph generator
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      - name: Run graph generator unit tests
        run: node --test scripts/generate-component-graph.spec.mjs

  # Main is protected (PR required + qa-approval), so this never pushes to main.
  # It force-updates one branch/PR. Merging that PR is optional batching — not
  # something every component PR has to do. Graph files are omitted from
  # on.push.paths so merging the refresh PR does not retrigger this job.
  update:
    name: Open PR if component graph is stale
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: component-graph-main
      cancel-in-progress: false

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      - name: Run graph generator unit tests
        run: node --test scripts/generate-component-graph.spec.mjs

      - name: Regenerate component graph
        run: node scripts/generate-component-graph.mjs

      - name: Open or update standing refresh PR
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo '::error::BOT_PAT is required to open a graph refresh PR because main is protected.'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/component-graph/component-graph.json docs/component-graph/component-graph.mmd
          if git diff --cached --quiet; then
            echo 'Component graph already matches main.'
            exit 0
          fi
          BRANCH="chore/refresh-component-graph"
          git checkout -B "${BRANCH}"
          git commit -m "chore: Refresh component dependency graph"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "${BRANCH}" --force
          EXISTING="$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            echo "Updated existing graph refresh PR #${EXISTING}."
            exit 0
          fi
          gh pr create \
            --title "chore: Refresh component dependency graph" \
            --body "Automated refresh after merges to \`main\`. JSON/Mermaid only. Feature PRs do not need to run \`npm run build:graph\` — this standing PR is updated in place after each merge." \
            --base main \
            --head "${BRANCH}"
