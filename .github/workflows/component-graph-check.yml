name: Component Graph Check

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'src/components/**'
      - 'src/custom-elements.json'
      - 'scripts/generate-component-graph.mjs'
      - 'scripts/component-graph-viewer.template.html'
      - 'docs/component-graph/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify component graph is up to date
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      # The generator only needs Node built-ins, but the graph must reflect
      # the CEM committed on this branch, so no install/build steps run here.
      - name: Run graph generator unit tests
        run: node --test scripts/generate-component-graph.spec.mjs

      - name: Regenerate component graph
        run: node scripts/generate-component-graph.mjs

      - name: Fail if the committed graph is stale
        run: |
          if ! git diff --exit-code -- docs/component-graph/; then
            echo ''
            echo '::error::docs/component-graph/ is out of date with the components on this branch.'
            echo 'Run `npm run build:graph` locally and commit the regenerated files.'
            exit 1
          fi
