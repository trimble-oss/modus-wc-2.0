name: Component Graph Check

on:
  pull_request:
    branches:
      - 'main'
    paths:
      - 'src/components/**'
      - 'src/custom-elements.json'
      - 'scripts/generate-component-graph.mjs'
      - 'docs/component-graph/**'
  push:
    branches:
      - 'main'
    paths:
      - 'src/components/**'
      - 'src/custom-elements.json'
      - 'scripts/generate-component-graph.mjs'
      - 'scripts/generate-component-graph.spec.mjs'
      - '.github/workflows/component-graph-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify component graph is up to date
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      # The generator only needs Node built-ins, but the graph must reflect
      # the CEM committed on this branch, so no install/build steps run here.
      - name: Run graph generator unit tests
        run: node --test scripts/generate-component-graph.spec.mjs

      - name: Regenerate component graph
        run: node scripts/generate-component-graph.mjs

      - name: Fail if the committed graph is stale
        run: |
          if ! git diff --exit-code -- docs/component-graph/component-graph.json docs/component-graph/component-graph.mmd; then
            echo ''
            echo '::error::docs/component-graph JSON/Mermaid is out of date with the components on this branch.'
            echo 'Run `npm run build:graph` locally and commit the regenerated files.'
            exit 1
          fi

  # Runs after a merge (push to main) or a manual Actions run on main.
  # Main is protected (PR required + qa-approval), so this job never pushes
  # to main. It opens or updates a PR with JSON/Mermaid only. Those files are
  # omitted from `on.push.paths` so merging the refresh PR does not retrigger
  # this job.
  update:
    name: Open PR if component graph is stale
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: component-graph-main
      cancel-in-progress: false

    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      - name: Run graph generator unit tests
        run: node --test scripts/generate-component-graph.spec.mjs

      - name: Regenerate component graph
        run: node scripts/generate-component-graph.mjs

      - name: Open pull request if the graph is stale
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo '::error::BOT_PAT is required to open a graph refresh PR because main is protected.'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/component-graph/component-graph.json docs/component-graph/component-graph.mmd
          if git diff --cached --quiet; then
            echo 'Component graph already matches main.'
            exit 0
          fi
          BRANCH="chore/refresh-component-graph"
          git checkout -B "${BRANCH}"
          git commit -m "chore: Refresh component dependency graph"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "${BRANCH}" --force
          EXISTING="$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            echo "Updated existing graph refresh PR #${EXISTING}."
            exit 0
          fi
          gh pr create \
            --title "chore: Refresh component dependency graph" \
            --body "Automated refresh after a merge to \`main\`. Updates \`docs/component-graph/component-graph.json\` and \`component-graph.mmd\` only. Regenerated with \`npm run build:graph\`." \
            --base main \
            --head "${BRANCH}"
