name: Merge Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests and check code coverage
        run: npm run test:coverage

  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Stencil components
        run: npm run build:ci

      - name: Upload dist for integration builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modus-wc-dist
          path: |
            dist
            integrations/**/stencil-generated
          retention-days: 1

  build-angular-integration:
    needs: build-dist
    uses: ./.github/workflows/build-angular.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-react-integration:
    needs: build-dist
    uses: ./.github/workflows/build-react.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-vue-integration:
    needs: build-dist
    uses: ./.github/workflows/build-vue.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-blazor-integration:
    uses: ./.github/workflows/build-blazor.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}

  merge-gate:
    if: always()
    needs:
      - lint
      - unit-tests
      - build-dist
      - build-angular-integration
      - build-react-integration
      - build-vue-integration
      - build-blazor-integration
    runs-on: ubuntu-latest

    steps:
      - name: Check for job failures
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "One or more jobs have failed or were cancelled. Please review the logs and fix the issues before merging."
              exit 1
            fi
          done
