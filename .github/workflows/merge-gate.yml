name: Merge Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  unit-tests:
    name: unit-tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    env:
      COVERAGE_SHARD: '1'

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate files required by unit tests
        run: npm run test:prepare

      - name: Run unit tests (shard ${{ matrix.shard }}/3)
        run: npx stencil test --spec --coverage --shard=${{ matrix.shard }}/3

      - name: Upload shard coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/coverage-final.json
          if-no-files-found: ignore
          retention-days: 1

  coverage:
    needs: unit-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download shard coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage-shards

      - name: Check merged coverage threshold
        run: npm run test:coverage:merge -- coverage-shards

  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2

      - name: Install dependencies
        run: npm ci

      - name: Build Stencil components
        run: npm run build:ci

      - name: Upload dist for integration builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: modus-wc-dist
          path: |
            dist
            integrations/**/stencil-generated
          retention-days: 1

  build-angular-integration:
    needs: build-dist
    uses: ./.github/workflows/build-angular.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-react-integration:
    needs: build-dist
    uses: ./.github/workflows/build-react.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-vue-integration:
    needs: build-dist
    uses: ./.github/workflows/build-vue.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-blazor-integration:
    uses: ./.github/workflows/build-blazor.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}

  merge-gate:
    if: always()
    needs:
      - lint
      - unit-tests
      - coverage
      - build-dist
      - build-angular-integration
      - build-react-integration
      - build-vue-integration
      - build-blazor-integration
    runs-on: ubuntu-latest

    steps:
      - name: Check for job failures
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "One or more jobs have failed or were cancelled. Please review the logs and fix the issues before merging."
              exit 1
            fi
          done
