name: Publish Blazor Story

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: gh-pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.x'

      - name: Install dependencies
        run: npm ci
        env:
          TRIMBLE_AGENTIC_NPM_TOKEN: ${{ secrets.TRIMBLE_AGENTIC_NPM_TOKEN }}
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Stencil components (generates Blazor RCL)
        run: npm run build:ci

      - name: Generate Blazor stories
        run: npm run generate:blazor-stories

      - name: Build Blazor RCL
        run: dotnet build integrations/blazor/stencil-generated/ModusWebComponents.Blazor -c Release

      - name: Compute base path
        id: base-path
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "path=/${REPO_NAME}/pr-preview/pr-${{ github.event.number }}/blazor/" >> $GITHUB_OUTPUT
          else
            BRANCH="${{ github.event.inputs.branch || 'main' }}"
            echo "path=/${REPO_NAME}/${BRANCH}/blazor/" >> $GITHUB_OUTPUT
          fi

      - name: Publish Blazor Story (static site)
        run: |
          dotnet publish integrations/blazor/blazing-story/BlazingStoryApp.csproj \
            -c Release \
            --output ./blazing-story-dist

      - name: Fix base href for subdirectory deployment
        run: |
          BASE_PATH="${{ steps.base-path.outputs.path }}"
          sed -i "s|<base href=\"/\" />|<base href=\"${BASE_PATH}\" />|g" \
            blazing-story-dist/wwwroot/index.html \
            blazing-story-dist/wwwroot/iframe.html

      - name: Deploy preview
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        id: preview-deploy
        with:
          folder: blazing-story-dist/wwwroot
          branch: gh-pages
          target-folder: pr-preview/pr-${{ github.event.number }}/blazor

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        id: deploy
        with:
          folder: blazing-story-dist/wwwroot
          branch: gh-pages
          target-folder: ${{ github.event.inputs.branch || 'main' }}/blazor

      - name: Print deployment URL
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.deploy.outcome == 'success'
        run: |
          BRANCH="${{ github.event.inputs.branch || 'main' }}"
          echo "Deployed to: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${BRANCH}/blazor/"

      - name: Post Blazor preview URL comment
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && steps.preview-deploy.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-preview/pr-${context.issue.number}/blazor/`;
            const marker = '<!-- blazor-preview-comment -->';
            const body = `${marker}\n## :rocket: Blazor Story Preview\n\nPreview is available at: ${previewUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Print failure message
        if: failure()
        run: echo "Deployment failed. Please check the logs for more information."
