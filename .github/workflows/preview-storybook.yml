name: Publish Storybook

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'
        type: string

permissions:
  contents: write
  packages: read
  pull-requests: write

concurrency:
  group: gh-pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          TRIMBLE_AGENTIC_NPM_TOKEN: ${{ secrets.TRIMBLE_AGENTIC_NPM_TOKEN }}
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Storybook
        run: npm run build

      # We need to copy the CSS so it can be served by Storybook.
      - name: Copy CSS file
        run: |
          cp src/styles/output.css storybook-static/public/output.css

      - name: Deploy preview
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        uses: JamesIves/github-pages-deploy-action@v4
        id: preview-deploy
        with:
          folder: storybook-static
          branch: gh-pages
          target-folder: pr-preview/pr-${{ github.event.number }}
          clean-exclude: blazor

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: JamesIves/github-pages-deploy-action@v4
        id: deploy
        with:
          folder: storybook-static
          branch: gh-pages
          target-folder: ${{ github.event.inputs.branch || 'main' }}
          clean-exclude: blazor

      - name: Print preview URL
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && steps.preview-deploy.outcome == 'success'
        run: |
          echo "Storybook preview: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/pr-preview/pr-${{ github.event.number }}/"

      - name: Print deployment URL
        if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && steps.deploy.outcome == 'success'
        run: |
          echo "Storybook deployed successfully to: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/${{ github.event.inputs.branch || 'main' }}/"

      - name: Print failure message
        if: failure()
        run: |
          echo "Deployment failed. Please check the logs for more information."
