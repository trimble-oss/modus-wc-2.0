<!doctype html>
<!-- Auto-generated by scripts/generate-component-graph.mjs — do not edit the copy in docs/component-graph/. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modus WC Component Dependency Graph</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #252a2e;
        --muted: #6a6e79;
        --line: #cbcdd6;
        --accent: #0063a3;
        --accent-soft: #dcedf9;
        --panel: #f1f1f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          'Open Sans',
          system-ui,
          -apple-system,
          sans-serif;
        color: var(--fg);
        background: var(--bg);
        display: grid;
        grid-template-columns: 1fr 340px;
        grid-template-rows: auto 1fr;
        height: 100vh;
      }

      header {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
      }

      header h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
      }

      header .stats {
        color: var(--muted);
        font-size: 12px;
      }

      header input {
        margin-inline-start: auto;
        width: 260px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 4px;
        font-size: 13px;
      }

      #canvas-wrap {
        position: relative;
        overflow: hidden;
      }

      canvas {
        display: block;
        cursor: grab;
      }

      aside {
        border-inline-start: 1px solid var(--line);
        padding: 14px;
        overflow-y: auto;
        font-size: 13px;
        background: var(--panel);
      }

      aside h2 {
        font-size: 14px;
        margin: 0 0 4px;
        word-break: break-all;
      }

      aside .hint {
        color: var(--muted);
      }

      aside h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 14px 0 4px;
      }

      aside ul {
        margin: 0;
        padding-inline-start: 18px;
      }

      aside li {
        margin: 2px 0;
        word-break: break-all;
      }

      aside code {
        background: var(--accent-soft);
        border-radius: 3px;
        padding: 0 4px;
        font-size: 12px;
      }

      aside li.clickable {
        color: var(--accent);
        cursor: pointer;
      }

      .legend {
        position: absolute;
        bottom: 10px;
        inset-inline-start: 12px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Modus WC Component Dependency Graph</h1>
      <span class="stats" id="stats"></span>
      <input id="search" type="search" placeholder="Search components…" />
    </header>
    <div id="canvas-wrap">
      <canvas id="graph"></canvas>
      <div class="legend">
        Solid edge: JSX composition &nbsp;•&nbsp; Dashed edge: slot composition
        &nbsp;•&nbsp; Click a node for details, drag to pan, scroll to zoom
      </div>
    </div>
    <aside id="details">
      <h2>Component details</h2>
      <p class="hint">Click a node to inspect its props, events, and impact.</p>
    </aside>
    <script>
      /*__GRAPH_DATA__*/

      const canvas = document.getElementById('graph');
      const ctx = canvas.getContext('2d');
      const wrap = document.getElementById('canvas-wrap');
      const details = document.getElementById('details');
      const searchInput = document.getElementById('search');

      document.getElementById('stats').textContent =
        GRAPH.nodes.length + ' components, ' + GRAPH.edges.length + ' edges';

      const nodes = GRAPH.nodes.map((n, i) => ({
        ...n,
        x: Math.cos((i / GRAPH.nodes.length) * 2 * Math.PI) * 420,
        y: Math.sin((i / GRAPH.nodes.length) * 2 * Math.PI) * 420,
        vx: 0,
        vy: 0,
        degree: 0,
      }));
      const byTag = new Map(nodes.map((n) => [n.tag, n]));
      const edges = GRAPH.edges
        .map((e) => ({ ...e, s: byTag.get(e.source), t: byTag.get(e.target) }))
        .filter((e) => e.s && e.t);
      edges.forEach((e) => {
        e.s.degree++;
        e.t.degree++;
      });

      let selected = null;
      let highlightSet = null;
      let query = '';
      let scale = 0.7;
      let offsetX = 0;
      let offsetY = 0;

      function resize() {
        canvas.width = wrap.clientWidth * devicePixelRatio;
        canvas.height = wrap.clientHeight * devicePixelRatio;
        canvas.style.width = wrap.clientWidth + 'px';
        canvas.style.height = wrap.clientHeight + 'px';
      }
      window.addEventListener('resize', resize);
      resize();

      // Simple force simulation: link springs + charge repulsion + centering.
      let ticks = 0;
      function simulate() {
        if (ticks++ > 400) return;
        for (const e of edges) {
          const dx = e.t.x - e.s.x;
          const dy = e.t.y - e.s.y;
          const dist = Math.max(1, Math.hypot(dx, dy));
          const force = (dist - 140) * 0.004;
          e.s.vx += (dx / dist) * force;
          e.s.vy += (dy / dist) * force;
          e.t.vx -= (dx / dist) * force;
          e.t.vy -= (dy / dist) * force;
        }
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const a = nodes[i];
            const b = nodes[j];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const d2 = Math.max(400, dx * dx + dy * dy);
            const force = 2600 / d2;
            const dist = Math.sqrt(d2);
            a.vx -= (dx / dist) * force;
            a.vy -= (dy / dist) * force;
            b.vx += (dx / dist) * force;
            b.vy += (dy / dist) * force;
          }
        }
        for (const n of nodes) {
          n.vx -= n.x * 0.0015;
          n.vy -= n.y * 0.0015;
          n.vx *= 0.85;
          n.vy *= 0.85;
          n.x += n.vx;
          n.y += n.vy;
        }
      }

      function nodeRadius(n) {
        return 5 + Math.min(10, n.degree * 0.7);
      }

      function toScreen(n) {
        return {
          x: canvas.width / 2 / devicePixelRatio + (n.x + offsetX) * scale,
          y: canvas.height / 2 / devicePixelRatio + (n.y + offsetY) * scale,
        };
      }

      function draw() {
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        ctx.clearRect(
          0,
          0,
          canvas.width / devicePixelRatio,
          canvas.height / devicePixelRatio
        );

        for (const e of edges) {
          const dim =
            highlightSet &&
            !(highlightSet.has(e.s.tag) && highlightSet.has(e.t.tag));
          const s = toScreen(e.s);
          const t = toScreen(e.t);
          ctx.strokeStyle = dim ? 'rgba(203,205,214,0.35)' : '#9fa4b1';
          ctx.setLineDash(e.type === 'slot' ? [4, 4] : []);
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(t.x, t.y);
          ctx.stroke();
          ctx.setLineDash([]);

          if (!dim) {
            const angle = Math.atan2(t.y - s.y, t.x - s.x);
            const r = nodeRadius(e.t) * scale + 4;
            const ax = t.x - Math.cos(angle) * r;
            const ay = t.y - Math.sin(angle) * r;
            ctx.fillStyle = '#9fa4b1';
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(
              ax - 7 * Math.cos(angle - 0.4),
              ay - 7 * Math.sin(angle - 0.4)
            );
            ctx.lineTo(
              ax - 7 * Math.cos(angle + 0.4),
              ay - 7 * Math.sin(angle + 0.4)
            );
            ctx.fill();
          }
        }

        ctx.font = '11px system-ui, sans-serif';
        for (const n of nodes) {
          const p = toScreen(n);
          const r = nodeRadius(n) * scale;
          const matchesQuery = query && n.tag.includes(query);
          const dimmed =
            (highlightSet && !highlightSet.has(n.tag)) ||
            (query && !matchesQuery);

          ctx.fillStyle =
            n === selected
              ? '#0063a3'
              : matchesQuery
                ? '#e49325'
                : dimmed
                  ? 'rgba(106,110,121,0.25)'
                  : '#4b5563';
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, 2 * Math.PI);
          ctx.fill();

          if (!dimmed || n === selected) {
            ctx.fillStyle = dimmed ? 'rgba(37,42,46,0.3)' : '#252a2e';
            ctx.fillText(n.tag.replace('modus-wc-', ''), p.x + r + 4, p.y + 4);
          }
        }
      }

      function loop() {
        simulate();
        draw();
        requestAnimationFrame(loop);
      }
      loop();

      function nodeAt(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        return nodes.find((n) => {
          const p = toScreen(n);
          return Math.hypot(p.x - x, p.y - y) <= nodeRadius(n) * scale + 4;
        });
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function renderList(title, items, mapper, clickable) {
        if (!items.length) return '';
        const rows = items
          .map(
            (item) =>
              '<li' +
              (clickable ? ' class="clickable" data-tag="' + item + '"' : '') +
              '>' +
              mapper(item) +
              '</li>'
          )
          .join('');
        return (
          '<h3>' + title + ' (' + items.length + ')</h3><ul>' + rows + '</ul>'
        );
      }

      function select(node) {
        selected = node;
        if (!node) {
          highlightSet = null;
          details.innerHTML =
            '<h2>Component details</h2><p class="hint">Click a node to inspect its props, events, and impact.</p>';
          return;
        }
        const renders = edges
          .filter((e) => e.s === node)
          .map((e) => e.t.tag)
          .sort();
        const usedBy = edges
          .filter((e) => e.t === node)
          .map((e) => e.s.tag)
          .sort();
        const impact = GRAPH.reverseImpact[node.tag] || [];
        highlightSet = new Set([node.tag, ...renders, ...usedBy]);

        details.innerHTML =
          '<h2>' +
          node.tag +
          '</h2>' +
          (node.description
            ? '<p class="hint">' + escapeHtml(node.description) + '</p>'
            : '') +
          renderList('Renders', renders, (t) => t, true) +
          renderList('Used by', usedBy, (t) => t, true) +
          renderList('QA impact (transitive parents)', impact, (t) => t, true) +
          renderList(
            'Props',
            node.props,
            (p) => '<code>' + p.name + '</code> ' + escapeHtml(p.type)
          ) +
          renderList(
            'Events',
            node.events,
            (e) => '<code>' + e.name + '</code> ' + escapeHtml(e.type)
          ) +
          renderList('Methods', node.methods, (m) => '<code>' + m + '</code>');

        details.querySelectorAll('li.clickable').forEach((li) => {
          li.addEventListener('click', () => {
            const target = byTag.get(li.dataset.tag);
            if (target) select(target);
          });
        });
      }

      let dragging = false;
      let lastX = 0;
      let lastY = 0;
      let moved = false;

      canvas.addEventListener('mousedown', (event) => {
        dragging = true;
        moved = false;
        lastX = event.clientX;
        lastY = event.clientY;
      });
      window.addEventListener('mousemove', (event) => {
        if (!dragging) return;
        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;
        if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
        offsetX += dx / scale;
        offsetY += dy / scale;
        lastX = event.clientX;
        lastY = event.clientY;
      });
      window.addEventListener('mouseup', (event) => {
        if (dragging && !moved) {
          select(nodeAt(event.clientX, event.clientY) || null);
        }
        dragging = false;
      });
      canvas.addEventListener(
        'wheel',
        (event) => {
          event.preventDefault();
          scale = Math.min(
            3,
            Math.max(0.2, scale * (event.deltaY < 0 ? 1.1 : 0.9))
          );
        },
        { passive: false }
      );

      searchInput.addEventListener('input', () => {
        query = searchInput.value.trim().toLowerCase();
      });
    </script>
  </body>
</html>
